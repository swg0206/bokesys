<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!-- 404：请求的页面或静态资源不存在 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>页面不存在</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">
<div style="max-width:520px;width:100%;padding:24px">
    <div class="auth-card" style="text-align:center;margin:0">
        <div style="font-size:52px;font-weight:700;color:var(--primary);line-height:1">404</div>
        <h2 style="margin:12px 0 10px;font-size:18px">页面不存在</h2>
        <p style="color:var(--text-sub);font-size:14px;margin-bottom:6px">
            你访问的地址可能已被删除或从未存在。
        </p>
        <p style="color:var(--text-sub);font-size:12.5px;margin-bottom:24px"
           th:if="${path != null}" th:text="'请求路径：' + ${path}">请求路径</p>
        <div style="display:flex;gap:10px;justify-content:center">
            <a class="btn btn-outline" href="javascript:history.back()">返回上一页</a>
            <a class="btn" th:href="@{/}">回到首页</a>
        </div>
    </div>
</div>
</body>
</html>
