<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
  后台登录页，对应《概要设计》6.2.2 与接口 API-09（Fun_07）。
  独立的居中卡片式布局，不显示后台侧边导航；背景为品牌渐变色。

  交互要点：点击验证码图片刷新；回车提交；提交期间按钮置为禁用并显示「登录中…」；
  登录失败在表单顶部显示红色提示，且不指明具体是哪一项错误（避免账号枚举）。
-->
<head th:replace="~{admin/fragments/head :: head('管理员登录')}">
    <title>管理员登录</title>
</head>
<body class="login-page">

<div class="login-card">
    <div class="head">
        <img class="logo" th:src="@{/img/logo.svg}" alt="">
        <h1>后台管理系统</h1>
        <p>请使用管理员账号登录</p>
    </div>

    <div class="alert alert-error" th:if="${error}" th:text="${error}">错误提示</div>
    <div class="alert alert-success" th:if="${message}" th:text="${message}">提示</div>

    <form th:action="@{/admin/login}" method="post" id="loginForm">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required
                   th:value="${username}" placeholder="请输入管理员账号"
                   autocomplete="username" autofocus>
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required
                   placeholder="请输入密码" autocomplete="current-password">
        </div>

        <div class="form-group">
            <label for="captcha">验证码</label>
            <div class="captcha-row">
                <input type="text" id="captcha" name="captcha" required maxlength="4"
                       placeholder="请输入计算结果" autocomplete="off">
                <!-- 换一张：改 src 触发浏览器重新请求 /admin/captcha -->
                <img th:src="@{/admin/captcha}" alt="验证码" title="点击刷新验证码"
                     id="captchaImage" onclick="refreshCaptcha()">
            </div>
            <div class="help" style="color:var(--text-sub);font-size:12.5px;margin-top:5px">
                请填写图中的计算结果
            </div>
        </div>

        <button class="btn submit" type="submit" id="submitBtn">登 录</button>
    </form>

    <div class="foot">
        <a th:href="@{/}">← 返回前台首页</a>
    </div>

    <div class="alert alert-info" style="margin-top:18px;font-size:12.5px">
        演示账号：admin / 123456<br>
        连续 5 次输错将锁定 60 秒
    </div>
</div>

<footer class="site-footer" style="position:fixed;left:0;right:0;bottom:0;
        background:transparent;border:none;color:rgba(255,255,255,.7);text-align:center;
        font-size:12.5px">
    基于 Spring Boot + MyBatis + Thymeleaf 构建
</footer>

<script>
    function refreshCaptcha() {
        // 加时间戳绕开浏览器缓存，保证每次都能拿到新验证码
        document.getElementById('captchaImage').src = '/admin/captcha?t=' + Date.now();
    }

    document.getElementById('loginForm').addEventListener('submit', function () {
        var btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = '登录中…';
    });
</script>
</body>
</html>
