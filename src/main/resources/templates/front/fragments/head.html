<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
  前台页面的 <head> 片段。
  统一引入 Bootstrap 5（组件层）与本项目的 style.css（布局与配色）。
  style.css 自带完整栅格与卡片样式，因此 CDN 不可达时页面依然成立。
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title != null and title != ''}
        ? |${title} - ${site != null ? site['site_name'] : '博客系统'}|
        : ${site != null ? site['site_name'] : '博客系统'}">博客系统</title>
    <meta name="description"
          th:attr="content=${site != null ? (site['site_description'] ?: '基于 Spring Boot 的博客系统') : '基于 Spring Boot 的博客系统'}">
    <meta name="keywords"
          th:attr="content=${site != null ? (site['site_keywords'] ?: '') : ''}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
</html>
