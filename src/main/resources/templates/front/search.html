<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
  搜索结果页，对应接口 API-03（Fun_02 文章搜索）。
  对文章标题与正文做模糊匹配后返回符合条件的文章列表及匹配条数提示。
-->
<head th:replace="~{front/fragments/head :: head(${pageTitle})}">
    <title>搜索</title>
</head>
<body>

<header th:replace="~{front/fragments/header :: header(${activeNav})}"></header>

<div class="page-wrap">
    <div class="grid-main">
        <main>
            <div class="card" style="background:#fff;border:1px solid var(--border);
                 border-radius:var(--radius);padding:14px 18px;margin-bottom:18px">
                关键词「<strong th:text="${keyword}">关键词</strong>」共匹配到
                <strong th:text="${page != null ? page.total : 0}">0</strong> 篇文章
            </div>

            <div th:if="${page != null and !page.empty}">
                <th:block th:each="article : ${page.list}">
                    <article th:replace="~{front/fragments/article-card :: card(${article})}"></article>
                </th:block>
            </div>

            <div class="empty-state" th:if="${page == null or page.empty}">
                <p style="margin:0 0 6px;font-size:16px">没有找到匹配的文章</p>
                <p style="margin:0;font-size:13.5px">换个关键词试试，或浏览全部文章</p>
            </div>
        </main>

        <div th:replace="~{front/fragments/sidebar :: sidebar}"></div>
    </div>
</div>

<!-- 分页链接前缀由控制器拼好并做了 URL 编码，这里直接透传 -->
<footer th:replace="~{front/fragments/footer :: footer(${page}, ${pageBase})}"></footer>

<button class="back-to-top" type="button" aria-label="回到顶部">↑</button>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
