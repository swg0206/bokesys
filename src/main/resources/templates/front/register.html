<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
  注册用户注册页，对应接口 API-23（Fun_16）。
  注册成功后自动登录并跳回首页。
-->
<head th:replace="~{front/fragments/head :: head(${pageTitle})}">
    <title>用户注册</title>
</head>
<body>

<header th:replace="~{front/fragments/header :: header(${null})}"></header>

<div class="auth-card">
    <h1>用户注册</h1>
    <p class="sub">注册后即可发表评论</p>

    <div class="alert alert-error" th:if="${error}" th:text="${error}">错误提示</div>

    <form th:action="@{/user/register}" method="post">
        <div class="form-group">
            <label for="username">用户名 <span style="color:var(--danger)">*</span></label>
            <input type="text" id="username" name="username" required
                   minlength="3" maxlength="50" th:value="${username}"
                   placeholder="3~50 个字符" autocomplete="username">
        </div>

        <div class="form-group">
            <label for="nickname">昵称</label>
            <input type="text" id="nickname" name="nickname" maxlength="50"
                   th:value="${nickname}" placeholder="评论时展示的名称，留空则用用户名">
        </div>

        <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" maxlength="100"
                   th:value="${email}" placeholder="选填">
        </div>

        <div class="form-group">
            <label for="password">密码 <span style="color:var(--danger)">*</span></label>
            <input type="password" id="password" name="password" required
                   minlength="6" maxlength="32" placeholder="6~32 个字符"
                   autocomplete="new-password">
        </div>

        <div class="form-group">
            <label for="confirmPassword">确认密码 <span style="color:var(--danger)">*</span></label>
            <input type="password" id="confirmPassword" name="confirmPassword" required
                   minlength="6" maxlength="32" placeholder="请再次输入密码"
                   autocomplete="new-password">
        </div>

        <button class="btn" type="submit" style="width:100%;padding:10px">注 册</button>
    </form>

    <div class="foot">
        已有账号？<a th:href="@{/user/login}">直接登录</a>
        <span style="color:var(--text-sub)"> · </span>
        <a th:href="@{/}">返回首页</a>
    </div>
</div>

<footer th:replace="~{front/fragments/footer :: footer(${null}, '/')}"></footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
